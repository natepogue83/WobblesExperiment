<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Wobblins</title>
  <meta name="description" content="A tiny valley of Wobblins who figure the world out for themselves. Shape their world, pick them up, fling them about, and watch what they invent.">
  <meta name="theme-color" content="#5f3d27">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <meta property="og:title" content="Wobblins">
  <meta property="og:description" content="Shape their world. Watch them figure it out.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat+Brush&family=Patrick+Hand&display=swap">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="handmade.css">
</head>
<body>
  <!-- Ink filters for the hand-made look: lines that wobble a little, and a sepia outline. -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <filter id="inked" x="-15%" y="-15%" width="130%" height="130%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.4" xChannelSelector="R" yChannelSelector="G" result="d"/>
      <feMorphology in="d" operator="dilate" radius="1.1" result="thick"/>
      <feFlood flood-color="#3a2717"/>
      <feComposite in2="thick" operator="in" result="outline"/>
      <feMerge><feMergeNode in="outline"/><feMergeNode in="d"/></feMerge>
    </filter>
    <filter id="wobble" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="3" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.2" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </svg>
  <main id="stage">
    <svg id="world" role="img" aria-label="The Wobblins' valley"></svg>
    <div id="hud"></div>
    <div id="toast" hidden></div>
    <section id="recap" class="card" hidden></section>
    <section id="giftCard" class="card" hidden></section>
    <section id="panel" class="card panel" hidden></section>
    <section id="newColony" class="card" hidden>
      <div id="napping"></div>
      <h2>A new colony</h2>
      <p>Three small Wobblins are waking up in an empty valley. You can't build anything for them. You can only shape their world, and see what they figure out.</p>
      <form id="newColonyForm">
        <label>Colony name <input id="colonyName" placeholder="leave blank for a surprise" maxlength="30"></label>
        <label>Your name, Keeper <input id="keeperName" placeholder="Keeper" maxlength="30"></label>
        <button type="submit">Wake them up</button>
      </form>
    </section>
    <aside id="debug" hidden></aside>
  </main>
  <nav id="bars">
    <div id="powers" class="bar"></div>
    <div id="nudges" class="bar"></div>
  </nav>
  <script type="module" src="src/ui/app.js"></script>
</body>
</html>
